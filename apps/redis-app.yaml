apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Djainesh/argocd-lab.git
    targetRevision: main
    path: manifests/redis
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
